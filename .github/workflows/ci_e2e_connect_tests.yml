name: E2E Connect Tests
# WX SLO 2 ("WalletKit connect flow works"): dApp → pairing → session proposal →
# wallet approves → session settled → sign request handled. The Flutter sample
# wallet (packages/reown_walletkit/example) and the Flutter AppKit sample dApp
# (packages/reown_appkit/example/base), both internal flavor, run on the same
# emulator/simulator; Maestro flows tagged `connect` (.maestro/connect_*.yaml,
# sign_reject.yaml). Same flow names, tag, env and test ids as
# react-native-examples', reown-kotlin's and reown-swift's connect suites; the
# wallet-side sub-flows are byte-identical to theirs so they can move to
# WalletConnect/actions.
# Android runs on PRs, nightly and on dispatch; iOS (macOS runner, expensive)
# nightly and on dispatch only.
# Kept apart from ci_e2e_pay_tests.yml so the E2E KPI job (WalletConnect/actions
# metrics/config/workflows.json) reports the Connect pass rate on its own.
# "(skip-metrics)" tells that job to drop this run. Don't change/remove it.
run-name: "E2E Connect Tests (${{ github.event.inputs.platform || (github.event_name == 'schedule' && 'both' || 'android') }})${{ ((github.event_name == 'pull_request' && github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && github.ref_name != 'develop')) && ' (skip-metrics)' || '' }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to run connect E2E tests'
        required: false
        type: choice
        options:
          - both
          - android
          - ios
        default: both
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'packages/reown_core/lib/**'
      - 'packages/reown_sign/lib/**'
      - 'packages/reown_walletkit/lib/**'
      - 'packages/reown_walletkit/example/**'
      - 'packages/reown_appkit/lib/**'
      - 'packages/reown_appkit/example/base/**'
      - '.maestro/connect_*.yaml'
      - '.maestro/sign_*.yaml'
      - '.maestro/flows/connect_*.yaml'
      - '.github/scripts/maestro/**'
      - '.github/workflows/ci_e2e_connect_tests.yml'
  schedule:
    # Daily at 03:00 UTC, before the Pay suite (07:00).
    - cron: '0 3 * * *'

# A new push to a PR cancels its superseded run; scheduled and dispatched runs
# are never cancelled by another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WALLET_APP_ID: com.walletconnect.flutterwallet.internal
  DAPP_APP_ID: com.walletconnect.flutterdapp.internal
  # Regex for the dApp's metadata name ("Reown's AppKit internal"), which the
  # wallet's "Connected Apps" rows show (connect_session_persists.yaml).
  DAPP_NAME: "Reown's AppKit"

jobs:
  e2e-connect-android:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'ios')
    # The KPI job matches this name (job_pattern) to get a per-platform rate.
    name: E2E Connect - Android
    runs-on: ubuntu-16core
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: x86_64

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      # Same Gradle/Pub caches as ci_e2e_pay_tests.yml (written only from the
      # default branch).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('packages/reown_walletkit/example/pubspec.lock', 'packages/reown_appkit/example/base/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Add secrets and keystore (wallet and dApp)
        env:
          SECRETS_FILE: ${{ secrets.SECRETS_FILE }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          for DIR in packages/reown_walletkit/example/android packages/reown_appkit/example/base/android; do
            echo "$SECRETS_FILE" > "$DIR/secrets.properties"
            echo "$KEYSTORE" | base64 --decode > "$DIR/app/debug.keystore"
          done

      # No TEST_WALLET_PRIVATE_KEY / ENABLE_TEST_MODE: the wallet generates a
      # fresh account, and personal_sign needs no funds.
      - name: Build wallet APK
        id: build_wallet
        working-directory: packages/reown_walletkit/example
        env:
          PROJECT_ID: ${{ secrets.WALLET_PROJECT_ID }}
        run: |
          flutter pub get
          flutter build apk \
            --flavor internal \
            --dart-define="PROJECT_ID=$PROJECT_ID" \
            --release \
            --target-platform android-x64 \
            --split-per-abi

      - name: Build dApp APK
        id: build_dapp
        working-directory: packages/reown_appkit/example/base
        env:
          PROJECT_ID: ${{ secrets.DAPP_PROJECT_ID }}
        run: |
          flutter pub get
          flutter build apk \
            --flavor internal \
            --dart-define="PROJECT_ID=$PROJECT_ID" \
            --release \
            --target-platform android-x64 \
            --split-per-abi

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823
        with:
          # Same pinned version as the Pay suite.
          version: '2.10.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default `packages` ("tools platform-tools"):
          # `sdkmanager tools` fails since Google removed that package.
          packages: platform-tools

      # Only personal_sign, no transactions. A failed flow is retried once
      # (only the failed ones).
      - name: Run emulator and tests
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TAGS: connect
          APP_ID: ${{ env.WALLET_APP_ID }}
          APK_PATH: packages/reown_walletkit/example/build/app/outputs/flutter-apk/app-x86_64-internal-release.apk
          DAPP_APK_PATH: packages/reown_appkit/example/base/build/app/outputs/flutter-apk/app-x86_64-internal-release.apk
          DEEPLINK_PREFIX: wcflutterwallet-internal://wc?uri=
          ARTIFACTS_DIR: /tmp/e2e-artifacts
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          heap-size: 576M
          avd-name: test_device
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          # android-emulator-runner runs each `script` line in its own `sh -c`,
          # so the whole leg lives in one script.
          script: bash .github/scripts/maestro/maestro-android.sh

      # Never upload APK/IPA.
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/ packages/reown_appkit/example/base/build/

      - name: Upload debug artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: connect-tests-debug-android
          path: |
            /tmp/e2e-artifacts/maestro-output/**/*.png
            /tmp/e2e-artifacts/maestro-output/**/*.jpg
            /tmp/e2e-artifacts/maestro-output/**/*.jpeg
            /tmp/e2e-artifacts/maestro-output/**/*.mp4
            /tmp/e2e-artifacts/maestro-output/**/*.mov
            /tmp/e2e-artifacts/maestro-output/**/*.webm
            /tmp/e2e-artifacts/maestro-output/**/*.gif
            /tmp/e2e-artifacts/maestro-output.log
            /tmp/e2e-artifacts/junit-attempt-*.xml
            /tmp/e2e-artifacts/android-logcat*.log
          retention-days: 14
          if-no-files-found: ignore

      # The full logcat is large and only useful when something failed.
      - name: Upload full logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-tests-full-logcat-android
          path: /tmp/e2e-artifacts/full-logcat.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure() && github.event_name != 'pull_request'
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - Android Connect - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - Android (connect)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`Android`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ (steps.build_wallet.outcome == 'success' && steps.build_dapp.outcome == 'success') && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }

  e2e-connect-ios:
    # macOS xlarge is expensive: nightly and dispatch only, never on PRs.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'android')
    # The KPI job matches this name (job_pattern) to get a per-platform rate.
    name: E2E Connect - iOS
    runs-on: macos-latest-xlarge
    timeout-minutes: 60
    env:
      # Simulators the suite is split across (--shard-split); each gets the
      # wallet and the dApp. Only personal_sign, so any split is safe.
      IOS_SIMULATORS: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install simslim
        env:
          # Same pinned release + checksum as ci_e2e_pay_tests.yml.
          SIMSLIM_VERSION: '0.11.0'
          SIMSLIM_SHA256: d7ae4d0c834dfea9911f113cf60e98c25ee61f2a3a85ca22d0c28c43b39ccfaf
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/simslim"
          mkdir -p "$DIR"
          curl -fsSL --proto "=https" --proto-redir "=https" \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 300 -o "$DIR/simslim.tar.gz" \
            "https://github.com/MobAI-App/simslim/releases/download/v${SIMSLIM_VERSION}/simslim-v${SIMSLIM_VERSION}-macos-arm64.tar.gz"
          echo "$SIMSLIM_SHA256  $DIR/simslim.tar.gz" | shasum -a 256 -c -
          tar -xzf "$DIR/simslim.tar.gz" -C "$DIR" simslim
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/simslim" --version

      # Booted before the build so first-boot notifications fire and go away
      # during the build.
      - name: Boot iOS simulators
        env:
          # A first boot can be slow on a loaded runner (10m default).
          SIMSLIM_BOOT_TIMEOUT: 15m
        run: bash .github/scripts/maestro/boot-simulators.sh

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Refresh CocoaPods specs
        run: pod repo update --silent

      # Wallet: same two-step build as ci_e2e_pay_tests.yml (x86_64 simulator
      # slice for mobile_scanner/MLKit, see there), without test mode: the
      # wallet generates a fresh account and personal_sign needs no funds.
      - name: Prepare wallet iOS artifacts
        working-directory: packages/reown_walletkit/example
        env:
          PROJECT_ID: ${{ secrets.WALLET_PROJECT_ID }}
        run: |
          flutter pub get
          flutter build ios \
            --config-only \
            --flavor internal \
            --simulator \
            --debug \
            --dart-define="PROJECT_ID=$PROJECT_ID"

      - name: Install wallet Pods
        working-directory: packages/reown_walletkit/example/ios
        run: pod install

      - name: Build wallet Runner.app (unsigned)
        id: build_wallet
        working-directory: packages/reown_walletkit/example/ios
        run: |
          set -o pipefail && env NSUnbufferedIO=YES \
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme internal \
              -configuration Debug-internal \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath ../build/ios-ddcache \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

      - name: Build dApp Runner.app
        id: build_dapp
        working-directory: packages/reown_appkit/example/base
        env:
          PROJECT_ID: ${{ secrets.DAPP_PROJECT_ID }}
        run: |
          flutter pub get
          flutter build ios \
            --flavor internal \
            --simulator \
            --debug \
            --dart-define="PROJECT_ID=$PROJECT_ID"

      - name: Install apps on simulators
        run: |
          set -euo pipefail
          WALLET_APP=$(find packages/reown_walletkit/example/build/ios-ddcache \
            -name "Runner.app" -path "*/Debug-internal-iphonesimulator/*" | head -1)
          DAPP_APP=$(find packages/reown_appkit/example/base/build/ios \
            -name "Runner.app" -path "*iphonesimulator*" | head -1)
          for APP in "$WALLET_APP" "$DAPP_APP"; do
            if [ -z "$APP" ]; then
              echo "ERROR: Runner.app not found"
              find packages/reown_walletkit/example/build packages/reown_appkit/example/base/build -name "Runner.app" || true
              exit 1
            fi
          done
          echo "Wallet: $WALLET_APP"
          echo "dApp:   $DAPP_APP"
          echo "WALLET_APP_PATH=$WALLET_APP" >> "$GITHUB_ENV"
          echo "DAPP_APP_PATH=$DAPP_APP" >> "$GITHUB_ENV"
          # Target each UDID, not `booted`: with several simulators up,
          # `booted` is ambiguous.
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          PIDS=()
          for ID in "${IDS[@]}"; do
            (xcrun simctl install "$ID" "$WALLET_APP" && xcrun simctl install "$ID" "$DAPP_APP") & PIDS+=($!)
          done
          for PID in "${PIDS[@]}"; do wait "$PID"; done

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823
        with:
          # Same pinned version as the Pay suite (multi-device --shard-split).
          version: '2.10.0'

      - name: Run Maestro iOS tests
        id: maestro
        env:
          MAESTRO_TAGS: connect
          APP_ID: ${{ env.WALLET_APP_ID }}
          DEEPLINK_PREFIX: wcflutterwallet-internal://wc?uri=
          ARTIFACTS_DIR: /tmp/e2e-artifacts
        run: |
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          mkdir -p "$ARTIFACTS_DIR"
          # Wallet + dApp process syslog at the default level, one per
          # simulator. Both apps' executables are "Runner". Uploaded only on
          # failure (see below).
          SYSLOG_PIDS=()
          for i in "${!IDS[@]}"; do
            xcrun simctl spawn "${IDS[$i]}" log stream \
              --style=compact \
              --predicate 'process == "Runner"' \
              > "$ARTIFACTS_DIR/ios-syslog-$((i + 1)).log" 2>&1 &
            SYSLOG_PIDS+=($!)
          done
          # The default `bash -e` would exit on a failed suite before the syslog
          # streams are stopped and the crash reports copied.
          set +e
          MAESTRO_DEVICES="$DEVICE_IDS" bash .github/scripts/maestro/maestro-suite.sh iOS
          maestro_exit_code=$?
          kill "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          wait "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          mkdir -p "$ARTIFACTS_DIR/ios-crash-reports"
          cp -R "$HOME/Library/Logs/DiagnosticReports/." "$ARTIFACTS_DIR/ios-crash-reports/" 2>/dev/null || true
          exit "$maestro_exit_code"

      # Never upload APK/IPA.
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/ packages/reown_appkit/example/base/build/

      - name: Upload debug artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: connect-tests-debug-ios
          path: |
            /tmp/e2e-artifacts/maestro-output/**/*.png
            /tmp/e2e-artifacts/maestro-output/**/*.jpg
            /tmp/e2e-artifacts/maestro-output/**/*.jpeg
            /tmp/e2e-artifacts/maestro-output/**/*.mp4
            /tmp/e2e-artifacts/maestro-output/**/*.mov
            /tmp/e2e-artifacts/maestro-output/**/*.webm
            /tmp/e2e-artifacts/maestro-output/**/*.gif
            /tmp/e2e-artifacts/maestro-output.log
            /tmp/e2e-artifacts/junit-attempt-*.xml
            /tmp/e2e-artifacts/ios-crash-reports/**
          retention-days: 14
          if-no-files-found: ignore

      # The app syslog is only useful when something failed.
      - name: Upload iOS syslog
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connect-tests-ios-syslog
          path: /tmp/e2e-artifacts/ios-syslog-*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - iOS Connect - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - iOS (connect)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`iOS`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ (steps.build_wallet.outcome == 'success' && steps.build_dapp.outcome == 'success') && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }
