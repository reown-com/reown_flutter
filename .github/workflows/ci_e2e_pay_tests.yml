name: E2E Pay Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to run pay E2E tests'
        required: false
        type: choice
        options:
          - both
          - android
          - ios
        default: both
  pull_request:
    paths:
      - 'packages/reown_walletkit/example/**'
      - 'packages/walletconnect_pay/**'
      - '.github/workflows/ci_e2e_pay_tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pay-tests-android:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'ios') }}
    runs-on: ubuntu-16core
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: x86_64
          cache: 'gradle'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Get wallet dependencies
        working-directory: packages/reown_walletkit/example
        run: flutter pub get

      - name: Add Secrets file
        working-directory: packages/reown_walletkit/example/android
        run: touch secrets.properties && echo "${{ secrets.SECRETS_FILE }}" >> secrets.properties

      - name: Add Keystore file
        working-directory: packages/reown_walletkit/example/android
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode >> app/debug.keystore

      - name: Build APK with test mode
        id: build
        working-directory: packages/reown_walletkit/example
        run: |
          flutter build apk \
            --flavor internal \
            --dart-define="PROJECT_ID=${{ secrets.WALLET_PROJECT_ID }}" \
            --dart-define="ENABLE_TEST_MODE=true" \
            --dart-define="TEST_WALLET_PRIVATE_KEY=${{ secrets.TEST_WALLET_PRIVATE_KEY }}" \
            --release \
            --target-platform android-x64 \
            --split-per-abi

      - name: Copy Maestro Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@f9522878950f7bd904a628b2c4d486b93034a4fe

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@f9522878950f7bd904a628b2c4d486b93034a4fe

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run emulator and tests
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          ram-size: 4096M
          emulator-boot-timeout: 600
          script: |
            # Install APK
            adb install -r packages/reown_walletkit/example/build/app/outputs/flutter-apk/app-x86_64-internal-release.apk

            # Run Maestro Pay tests
            MAESTRO_ARGS=(
              "--include-tags" "pay"
              "--env" "APP_ID=com.walletconnect.flutterwallet.internal"
              "--env" "WPAY_CUSTOMER_KEY_SINGLE_NOKYC=${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}"
              "--env" "WPAY_MERCHANT_ID_SINGLE_NOKYC=${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}"
              "--env" "WPAY_CUSTOMER_KEY_MULTI_NOKYC=${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}"
              "--env" "WPAY_MERCHANT_ID_MULTI_NOKYC=${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}"
              "--env" "WPAY_CUSTOMER_KEY_MULTI_KYC=${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}"
              "--env" "WPAY_MERCHANT_ID_MULTI_KYC=${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}"
              "--test-output-dir" "/tmp/maestro-output"
              "--debug-output" "/tmp/maestro-debug"
              ".maestro/"
            )
            maestro test "${MAESTRO_ARGS[@]}"

      # Clean up APK before uploading artifacts — never upload APK/IPA
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/

      - name: Capture logcat
        if: always()
        run: adb logcat -d > /tmp/logcat.txt 2>/dev/null || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-debug-android
          path: |
            /tmp/logcat.txt
            /tmp/maestro-output/
            /tmp/maestro-debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - Android Pay - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - Android (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`Android`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }

  pay-tests-ios:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'android') }}
    runs-on: macos-26-xlarge
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use simulator build/install for Maestro E2E; do not reuse release/TestFlight signing flow.
      - name: Select Xcode 26.2
        run: |
          test -d /Applications/Xcode_26.2.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Get wallet dependencies
        working-directory: packages/reown_walletkit/example
        run: flutter pub get

      - name: Refresh CocoaPods specs
        run: pod repo update --silent

      - name: Build iOS simulator app with test mode
        id: build_ios
        working-directory: packages/reown_walletkit/example
        run: |
          flutter build ios \
            --flavor internal \
            --simulator \
            --debug \
            --dart-define="PROJECT_ID=${{ secrets.WALLET_PROJECT_ID }}" \
            --dart-define="ENABLE_TEST_MODE=true" \
            --dart-define="TEST_WALLET_PRIVATE_KEY=${{ secrets.TEST_WALLET_PRIVATE_KEY }}"

      - name: Create and boot simulator
        id: simulator
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes iOS -j | /usr/bin/python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable")]; print(r[-1]["identifier"] if r else "")')"
          if [ -z "$RUNTIME_ID" ]; then
            echo "Unable to find available iOS runtime"
            exit 1
          fi

          DEVICE_ID=""
          DEVICE_ID="$(xcrun simctl create "Pay-E2E-iPhone" "iPhone 16" "$RUNTIME_ID" 2>/dev/null || true)"
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID="$(xcrun simctl list devices "$RUNTIME_ID" -j | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin).get("devices",{}); devices=d.get(sys.argv[1],[]); print(next((x["udid"] for x in devices if x.get("isAvailable") and x.get("name")=="iPhone 16"), ""))' "$RUNTIME_ID")"
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "Unable to create/find iPhone 16 simulator"
            exit 1
          fi

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Install built app on simulator
        run: |
          xcrun simctl install "$DEVICE_ID" \
            packages/reown_walletkit/example/build/ios/iphonesimulator/Runner.app

      - name: Copy Maestro Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@f9522878950f7bd904a628b2c4d486b93034a4fe

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@f9522878950f7bd904a628b2c4d486b93034a4fe

      - name: Run Maestro iOS tests
        id: maestro_ios
        run: |
          MAESTRO_ARGS=(
            "--include-tags" "pay"
            "--device" "$DEVICE_ID"
            "--env" "APP_ID=com.walletconnect.flutterwallet.internal"
            "--env" "WPAY_CUSTOMER_KEY_SINGLE_NOKYC=${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}"
            "--env" "WPAY_MERCHANT_ID_SINGLE_NOKYC=${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}"
            "--env" "WPAY_CUSTOMER_KEY_MULTI_NOKYC=${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}"
            "--env" "WPAY_MERCHANT_ID_MULTI_NOKYC=${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}"
            "--env" "WPAY_CUSTOMER_KEY_MULTI_KYC=${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}"
            "--env" "WPAY_MERCHANT_ID_MULTI_KYC=${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}"
            "--test-output-dir" "/tmp/maestro-output"
            "--debug-output" "/tmp/maestro-debug"
            ".maestro/"
          )
          maestro test "${MAESTRO_ARGS[@]}"

      # Clean up app build before uploading artifacts — never upload APK/IPA
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-debug-ios
          path: |
            /tmp/maestro-output/
            /tmp/maestro-debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - iOS Pay - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - iOS (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`iOS`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build_ios.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro_ios.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }
