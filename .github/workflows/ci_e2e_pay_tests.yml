name: E2E Pay Tests
# "(skip-metrics)" tells the E2E KPI job (WalletConnect/actions) to drop this run.
run-name: "E2E Pay Tests (${{ github.event.inputs.platform || 'both' }})${{ ((github.event_name == 'pull_request' && github.event.pull_request.draft) || (github.event_name == 'workflow_dispatch' && github.ref_name != 'develop')) && ' (skip-metrics)' || '' }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to run pay E2E tests'
        required: false
        type: choice
        options:
          - both
          - android
          - ios
        default: both
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'packages/reown_walletkit/example/**'
      - 'packages/walletconnect_pay/**'
      - '.github/workflows/ci_e2e_pay_tests.yml'
      - '.github/workflows/e2e_balance_check.yml'
      - '.github/actions/derive-e2e-wallet/**'
      - '.github/actions/install-cast/**'
      - '.github/scripts/maestro/**'
  schedule:
    # Run daily at 07:00 UTC
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-balance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The faucet bot sends from one wallet and drops a same-chain request that
    # arrives before its previous send is mined, so runs never request at the
    # same time (e.g. the daily cron and a PR run).
    concurrency:
      group: e2e-faucet-requests
      cancel-in-progress: false
    uses: ./.github/workflows/e2e_balance_check.yml
    secrets: inherit

  pay-tests-android:
    needs: check-balance
    # !cancelled() rather than always(): still runs when check-balance fails or
    # is skipped, but Cancel stops it (GitHub leaves an `always()` job running).
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'ios')) }}
    runs-on: ubuntu-16core
    timeout-minutes: 45
    # This leg's own test wallet (see derive-e2e-wallet): runs from other refs
    # queue instead of paying from the same account at the same time. GitHub
    # keeps one pending run per group; a newer one replaces it.
    concurrency:
      group: e2e-wallet-flutter-android
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This leg's account in the mnemonic shared with the other SDK repos
      # (index 5; see the action for the reserved indexes), so no other repo or
      # leg races this suite on the Polygon nonce or the Permit2 allowance.
      - name: Derive E2E wallet
        id: wallet
        uses: ./.github/actions/derive-e2e-wallet
        with:
          mnemonic: ${{ secrets.TEST_WALLET_MNEMONIC }}
          index: 5
          expected-address: ${{ vars.TEST_WALLET_ADDRESS_ANDROID }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          architecture: x86_64

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      # setup-gradle caches Gradle User Home (dependencies, wrapper, transforms)
      # and cleans out unused entries. It only writes from the default branch
      # (develop: the daily cron); PR and dispatch runs restore develop's latest
      # entry read-only. Cache stats go to the job summary.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('packages/reown_walletkit/example/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get wallet dependencies
        working-directory: packages/reown_walletkit/example
        run: flutter pub get

      - name: Add Secrets file
        working-directory: packages/reown_walletkit/example/android
        env:
          SECRETS_FILE: ${{ secrets.SECRETS_FILE }}
        run: touch secrets.properties && echo "$SECRETS_FILE" >> secrets.properties

      - name: Add Keystore file
        working-directory: packages/reown_walletkit/example/android
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode >> app/debug.keystore

      - name: Build APK with test mode
        id: build
        working-directory: packages/reown_walletkit/example
        # Via env, not inline ${{ }}, so the key never lands in the script.
        env:
          PROJECT_ID: ${{ secrets.WALLET_PROJECT_ID }}
          TEST_WALLET_PRIVATE_KEY: ${{ steps.wallet.outputs.private-key }}
        run: |
          flutter build apk \
            --flavor internal \
            --dart-define="PROJECT_ID=$PROJECT_ID" \
            --dart-define="ENABLE_TEST_MODE=true" \
            --dart-define="TEST_WALLET_PRIVATE_KEY=$TEST_WALLET_PRIVATE_KEY" \
            --release \
            --target-platform android-x64 \
            --split-per-abi

      # The merchant inputs enable the expired-payment pool for pay_expired_link:
      # payments only expire 15 min after creation, so each run uses one an
      # earlier run created (kept in actions/cache) and seeds a new one.
      - name: Copy Maestro Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@390045a88d335d438c972b422090144158df6823
        with:
          merchant-api-key: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          merchant-id: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823
        with:
          # Pinned so run timings and multi-device (--shard-split) behavior are
          # comparable across runs; bump deliberately (the default is latest).
          version: '2.10.0'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's default `packages` ("tools platform-tools").
          # Google removed the deprecated `tools` package from the SDK repo, so
          # `sdkmanager tools` now fails with "Failed to find package 'tools'".
          packages: platform-tools

      - name: Run emulator and tests
        id: maestro
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: com.walletconnect.flutterwallet.internal
          APK_PATH: packages/reown_walletkit/example/build/app/outputs/flutter-apk/app-x86_64-internal-release.apk
          DEEPLINK_PREFIX: wcflutterwallet-internal://wc?uri=
          ARTIFACTS_DIR: /tmp/e2e-artifacts
          WPAY_CUSTOMER_KEY_SINGLE_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          WPAY_MERCHANT_ID_SINGLE_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}
          WPAY_MERCHANT_ID_MULTI_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_KYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}
          WPAY_MERCHANT_ID_MULTI_KYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          heap-size: 576M
          avd-name: test_device
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          # android-emulator-runner runs each `script` line in its own `sh -c`,
          # so the whole leg lives in one script. It retries only the failed
          # flows once.
          script: bash .github/scripts/maestro/maestro-android.sh

      # Reset the USDT Permit2 allowance back to 0 so the next pay_usdt_polygon
      # run re-exercises the on-chain approve step. Runs even when the suite
      # failed (if: always()) so a mid-flow failure doesn't leave the allowance
      # set; continue-on-error so a reset hiccup can't fail an otherwise-green
      # run. Node step (signs a tx) — the private key goes via env, never the CLI.
      - name: Reset USDT Permit2 allowance (Polygon)
        if: always()
        continue-on-error: true
        uses: WalletConnect/actions/maestro/permit2-reset@390045a88d335d438c972b422090144158df6823
        with:
          chain-id: eip155:137
          rpc-url: https://polygon-bor-rpc.publicnode.com
          token-address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F'
          private-key: ${{ steps.wallet.outputs.private-key }}

      # Clean up APK before uploading artifacts — never upload APK/IPA
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-debug-android
          path: |
            /tmp/e2e-artifacts/maestro-output/**/*.png
            /tmp/e2e-artifacts/maestro-output/**/*.jpg
            /tmp/e2e-artifacts/maestro-output/**/*.jpeg
            /tmp/e2e-artifacts/maestro-output/**/*.mp4
            /tmp/e2e-artifacts/maestro-output/**/*.mov
            /tmp/e2e-artifacts/maestro-output/**/*.webm
            /tmp/e2e-artifacts/maestro-output/**/*.gif
            /tmp/e2e-artifacts/maestro-output.log
            /tmp/e2e-artifacts/junit-attempt-*.xml
            /tmp/e2e-artifacts/android-logcat*.log
          retention-days: 14
          if-no-files-found: ignore

      # The full logcat is large and only useful when something failed.
      - name: Upload full logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-full-logcat-android
          path: /tmp/e2e-artifacts/full-logcat.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - Android Pay - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - Android (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`Android`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }

  pay-tests-ios:
    needs: check-balance
    # !cancelled() rather than always(): see pay-tests-android.
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform != 'android')) }}
    runs-on: macos-latest-xlarge
    timeout-minutes: 60
    # This leg's own test wallet; see pay-tests-android.
    concurrency:
      group: e2e-wallet-flutter-ios
      cancel-in-progress: false
    env:
      # Simulators the Maestro suite is split across (--shard-split). Slim
      # simulators peak at ~2.3 GB each (stock ~5.5 GB); set 1 to run serially.
      IOS_SIMULATORS: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Index 6; see pay-tests-android.
      - name: Derive E2E wallet
        id: wallet
        uses: ./.github/actions/derive-e2e-wallet
        with:
          mnemonic: ${{ secrets.TEST_WALLET_MNEMONIC }}
          index: 6
          expected-address: ${{ vars.TEST_WALLET_ADDRESS_IOS }}

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # simslim disables simulator services the suite doesn't need before the
      # first boot (profile: .github/scripts/maestro/simslim-ci.json).
      - name: Install simslim
        env:
          # Pinned release + checksum: simslim is young and ships often.
          SIMSLIM_VERSION: '0.11.0'
          SIMSLIM_SHA256: d7ae4d0c834dfea9911f113cf60e98c25ee61f2a3a85ca22d0c28c43b39ccfaf
        run: |
          set -uo pipefail
          DIR="$RUNNER_TEMP/simslim"
          install_simslim() {
            mkdir -p "$DIR" &&
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
                --connect-timeout 20 --max-time 300 -o "$DIR/simslim.tar.gz" \
                "https://github.com/MobAI-App/simslim/releases/download/v${SIMSLIM_VERSION}/simslim-v${SIMSLIM_VERSION}-macos-arm64.tar.gz" &&
              echo "$SIMSLIM_SHA256  $DIR/simslim.tar.gz" | shasum -a 256 -c - &&
              tar -xzf "$DIR/simslim.tar.gz" -C "$DIR" simslim
          }
          if install_simslim; then
            echo "$DIR" >> "$GITHUB_PATH"
            "$DIR/simslim" --version
          else
            echo "::error::Could not install simslim v$SIMSLIM_VERSION"
            exit 1
          fi

      - name: Boot iOS simulators
        env:
          # A first boot can be slow on a loaded runner (10m default).
          SIMSLIM_BOOT_TIMEOUT: 15m
        run: |
          set -euo pipefail
          if ! [[ "$IOS_SIMULATORS" =~ ^[1-9]$ ]]; then
            echo "::error::IOS_SIMULATORS must be 1-9, got '$IOS_SIMULATORS'"
            exit 1
          fi
          # Don't hardcode a model: Xcode/runner image bumps drop old devices.
          # Create fresh devices from the newest iPhone device type, falling back
          # to one already-available iPhone simulator. `simctl list devicetypes`
          # is newest-first, so take the first match. Filter by name too: the
          # iPod touch also has productFamily "iPhone" (current runtimes can't
          # create it).
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | \
            jq -r 'first(.devicetypes[] | select(.productFamily == "iPhone" and (.name | startswith("iPhone"))) | .identifier) // empty')
          DEVICE_IDS=()
          FRESH=true
          : > "$RUNNER_TEMP/simctl-create.err"
          for i in $(seq 1 "$IOS_SIMULATORS"); do
            if [ -n "$DEVICE_TYPE" ] && ID=$(xcrun simctl create "E2E-iPhone-$i" "$DEVICE_TYPE" 2>"$RUNNER_TEMP/simctl-create.err"); then
              DEVICE_IDS+=("$ID")
            else
              break
            fi
          done
          if [ "${#DEVICE_IDS[@]}" -eq 0 ]; then
            echo "::warning::Could not create a simulator from '${DEVICE_TYPE:-<none>}' ($(cat "$RUNNER_TEMP/simctl-create.err" 2>/dev/null)); falling back to an existing iPhone simulator"
            DEVICE_TYPE=""
            FRESH=false
            ID=$(xcrun simctl list devices available -j | \
              jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .udid' | head -1)
            [ -n "$ID" ] && DEVICE_IDS=("$ID")
          fi
          if [ "${#DEVICE_IDS[@]}" -eq 0 ]; then
            echo "ERROR: no available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          if [ "${#DEVICE_IDS[@]}" -lt "$IOS_SIMULATORS" ]; then
            echo "::warning::Only ${#DEVICE_IDS[@]} of $IOS_SIMULATORS simulators available; running on ${#DEVICE_IDS[@]}"
          fi
          echo "Using simulator device type: ${DEVICE_TYPE:-<fallback>}, ids: ${DEVICE_IDS[*]}"
          SIMSLIM_PROFILE="$GITHUB_WORKSPACE/.github/scripts/maestro/simslim-ci.json"
          # Slim and boot all devices in parallel. simslim writes its overrides
          # while the device is still off, so it only applies to freshly created
          # devices; the existing-simulator fallback boots stock.
          PIDS=()
          for ID in "${DEVICE_IDS[@]}"; do
            if [ "$FRESH" = "true" ]; then
              # Fails on drift rather than silently testing on a stock
              # simulator.
              ( simslim on "$ID" --profile "$SIMSLIM_PROFILE" &&
                  simslim verify "$ID" --profile "$SIMSLIM_PROFILE" ) &
            else
              ( xcrun simctl boot "$ID" || true ) &
            fi
            PIDS+=($!)
          done
          for PID in "${PIDS[@]}"; do wait "$PID" || exit 1; done
          for ID in "${DEVICE_IDS[@]}"; do
            # Wait for full boot so the steps below don't race a not-ready
            # simulator.
            xcrun simctl bootstatus "$ID" -b
            # Disable UIKit animations to reduce Maestro timing flakiness.
            xcrun simctl spawn "$ID" defaults write com.apple.UIKit UIAnimationDragCoefficient -float 0 || true
          done
          echo "DEVICE_IDS=$(IFS=,; echo "${DEVICE_IDS[*]}")" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Get wallet dependencies
        working-directory: packages/reown_walletkit/example
        run: flutter pub get

      - name: Refresh CocoaPods specs
        run: pod repo update --silent

      # Two-step iOS simulator build: let Flutter emit Dart kernel +
      # Generated.xcconfig, then drive xcodebuild ourselves. The custom
      # xcodebuild step exists only to pin ARCHS=x86_64 for the
      # mobile_scanner/MLKit simulator slice (see the build step below) —
      # `flutter build ios --simulator` can't override ARCHS. The build is
      # unsigned: the pay suite no longer exercises Universal Links, so no
      # associated-domains entitlement needs to survive.
      - name: Prepare Flutter iOS artifacts
        working-directory: packages/reown_walletkit/example
        # Via env, not inline ${{ }}, so the key never lands in the script.
        env:
          PROJECT_ID: ${{ secrets.WALLET_PROJECT_ID }}
          TEST_WALLET_PRIVATE_KEY: ${{ steps.wallet.outputs.private-key }}
        run: |
          flutter build ios \
            --config-only \
            --flavor internal \
            --simulator \
            --debug \
            --dart-define="PROJECT_ID=$PROJECT_ID" \
            --dart-define="ENABLE_TEST_MODE=true" \
            --dart-define="TEST_WALLET_PRIVATE_KEY=$TEST_WALLET_PRIVATE_KEY"

      - name: Install Pods
        working-directory: packages/reown_walletkit/example/ios
        run: pod install

      - name: Build Runner.app via xcodebuild (unsigned)
        id: build_ios
        working-directory: packages/reown_walletkit/example/ios
        # Build the simulator app for x86_64. mobile_scanner pulls in Google
        # MLKit, whose .frameworks are fat binaries with an arm64-*device*
        # slice and an x86_64-*simulator* slice, but NO arm64-simulator slice.
        # On the Apple Silicon runner the default arm64 simulator build fails
        # to link MLKit ("building for 'iOS-simulator', but linking in object
        # file ... built for 'iOS'"). x86_64 is the only working simulator
        # slice; it runs on the simulator via Rosetta 2. EXCLUDED_ARCHS alone
        # isn't enough (arm64 is the standard arch here), so pin ARCHS=x86_64
        # with ONLY_ACTIVE_ARCH=NO.
        run: |
          set -o pipefail && env NSUnbufferedIO=YES \
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme internal \
              -configuration Debug-internal \
              -sdk iphonesimulator \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath ../build/ios-ddcache \
              ARCHS=x86_64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

      - name: Install app on simulators
        run: |
          set -euo pipefail
          APP_PATH=$(find packages/reown_walletkit/example/build/ios-ddcache \
            -name "Runner.app" -path "*/Debug-internal-iphonesimulator/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found in DerivedData"
            find packages/reown_walletkit/example/build -name "Runner.app" || true
            exit 1
          fi
          echo "Installing: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          # Target each UDID, not `booted`: with several simulators up,
          # `booted` is ambiguous.
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          PIDS=()
          for ID in "${IDS[@]}"; do xcrun simctl install "$ID" "$APP_PATH" & PIDS+=($!); done
          for PID in "${PIDS[@]}"; do wait "$PID"; done

      # The merchant inputs enable the expired-payment pool for pay_expired_link:
      # payments only expire 15 min after creation, so each run uses one an
      # earlier run created (kept in actions/cache) and seeds a new one.
      - name: Copy Maestro Pay test flows
        uses: WalletConnect/actions/maestro/pay-tests@390045a88d335d438c972b422090144158df6823
        with:
          merchant-api-key: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          merchant-id: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}

      - name: Install Maestro CLI
        uses: WalletConnect/actions/maestro/setup@390045a88d335d438c972b422090144158df6823
        with:
          # Pinned so run timings and multi-device (--shard-split) behavior are
          # comparable across runs; bump deliberately (the default is latest).
          version: '2.10.0'

      - name: Run Maestro iOS tests
        id: maestro_ios
        env:
          APP_ID: com.walletconnect.flutterwallet.internal
          DEEPLINK_PREFIX: wcflutterwallet-internal://wc?uri=
          ARTIFACTS_DIR: /tmp/e2e-artifacts
          WPAY_CUSTOMER_KEY_SINGLE_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_SINGLE_NOKYC }}
          WPAY_MERCHANT_ID_SINGLE_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_SINGLE_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_NOKYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_NOKYC }}
          WPAY_MERCHANT_ID_MULTI_NOKYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_NOKYC }}
          WPAY_CUSTOMER_KEY_MULTI_KYC: ${{ secrets.WPAY_CUSTOMER_KEY_MULTI_KYC }}
          WPAY_MERCHANT_ID_MULTI_KYC: ${{ secrets.WPAY_MERCHANT_ID_MULTI_KYC }}
        run: |
          IFS=, read -ra IDS <<< "$DEVICE_IDS"
          mkdir -p "$ARTIFACTS_DIR"
          # App-process-only syslog at the default level (no debug/info noise),
          # one per simulator. Only uploaded on failure (see below). The process
          # name is read from the built app.
          APP_PROCESS=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo Runner)
          SYSLOG_PIDS=()
          for i in "${!IDS[@]}"; do
            xcrun simctl spawn "${IDS[$i]}" log stream \
              --style=compact \
              --predicate "process == \"$APP_PROCESS\"" \
              > "$ARTIFACTS_DIR/ios-syslog-$((i + 1)).log" 2>&1 &
            SYSLOG_PIDS+=($!)
          done
          # With several simulators, one Maestro process splits the flows across
          # them. Only pay_usdt_polygon sends txs from the wallet (Polygon Permit2
          # approve); Base/Optimism payments are gasless EIP-3009 authorizations,
          # so any split is nonce-safe.
          # The default `bash -e` would exit on a failed suite before the syslog
          # streams are stopped and the crash reports copied.
          set +e
          MAESTRO_DEVICES="$DEVICE_IDS" bash .github/scripts/maestro/maestro-suite.sh iOS
          maestro_exit_code=$?
          kill "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          wait "${SYSLOG_PIDS[@]}" 2>/dev/null || true
          mkdir -p "$ARTIFACTS_DIR/ios-crash-reports"
          cp -R "$HOME/Library/Logs/DiagnosticReports/." "$ARTIFACTS_DIR/ios-crash-reports/" 2>/dev/null || true
          exit "$maestro_exit_code"

      # Reset the USDT Permit2 allowance back to 0 so the next pay_usdt_polygon
      # run re-exercises the on-chain approve step. Runs even when the suite
      # failed (if: always()) so a mid-flow failure doesn't leave the allowance
      # set; continue-on-error so a reset hiccup can't fail an otherwise-green
      # run. Node step (signs a tx) — the private key goes via env, never the CLI.
      - name: Reset USDT Permit2 allowance (Polygon)
        if: always()
        continue-on-error: true
        uses: WalletConnect/actions/maestro/permit2-reset@390045a88d335d438c972b422090144158df6823
        with:
          chain-id: eip155:137
          rpc-url: https://polygon-bor-rpc.publicnode.com
          token-address: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F'
          private-key: ${{ steps.wallet.outputs.private-key }}

      # Clean up app build before uploading artifacts — never upload APK/IPA
      - name: Clean up build artifacts
        if: always()
        run: rm -rf packages/reown_walletkit/example/build/

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-debug-ios
          path: |
            /tmp/e2e-artifacts/maestro-output/**/*.png
            /tmp/e2e-artifacts/maestro-output/**/*.jpg
            /tmp/e2e-artifacts/maestro-output/**/*.jpeg
            /tmp/e2e-artifacts/maestro-output/**/*.mp4
            /tmp/e2e-artifacts/maestro-output/**/*.mov
            /tmp/e2e-artifacts/maestro-output/**/*.webm
            /tmp/e2e-artifacts/maestro-output/**/*.gif
            /tmp/e2e-artifacts/maestro-output.log
            /tmp/e2e-artifacts/junit-attempt-*.xml
            /tmp/e2e-artifacts/ios-crash-reports/**
          retention-days: 14
          if-no-files-found: ignore

      # The app syslog is only useful when something failed.
      - name: Upload iOS syslog
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pay-tests-ios-syslog
          path: /tmp/e2e-artifacts/ios-syslog-*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Send Slack notification
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "E2E Test Report - iOS Pay - WalletKit Flutter",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🧪 E2E Test Report - iOS (pay)" }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Project:*\n`WalletKit Flutter`" },
                    { "type": "mrkdwn", "text": "*Platform:*\n`iOS`" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Trigger:*\n`${{ github.event_name }}`" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Build:*\n`${{ steps.build_ios.outcome == 'success' && '✅ Success' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Maestro Tests:*\n`${{ steps.maestro_ios.outcome == 'success' && '✅ Passed' || '❌ Failed' }}`" },
                    { "type": "mrkdwn", "text": "*Overall Status:*\n`${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Download Artifacts" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
                    }
                  ]
                }
              ]
            }
