            yq e ".dependencies.reown_core = \"^$CORE_VERSION\"" -i pubspec.yaml
          fi
          if [[ "${{ github.event.inputs.sign }}" == 'true' && -n "$SIGN_VERSION" ]]; then
            echo "Setting reown_sign to ^$SIGN_VERSION"
