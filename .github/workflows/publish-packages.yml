name: Publish Reown Flutter Packages

on:
  workflow_dispatch: # Allows manual triggering
    inputs:
      core:
        description: "Publish Core?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      sign:
        description: "Publish Sign?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      appkit:
        description: "Publish AppKit?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      walletkit:
        description: "Publish WalletKit?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      cli:
        description: "Publish CLI?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      yttrium:
        description: "Publish Yttrium?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      pos:
        description: "Publish POS?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      walletconnect_pay:
        description: "Publish WalletConnect Pay?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write # Required to commit pubspec.yaml changes back to the repo
  pull-requests: write # Required to create pull requests

jobs:
  create-branch:
    name: Create Release Branch
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.create_branch.outputs.branch_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch
        id: create_branch
        run: |
          BRANCH_NAME="publish_workflow_${{ github.run_number }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME

          echo "Created and pushed branch: $BRANCH_NAME"

  publish-core:
    name: Publish reown_core
    needs: [create-branch, publish-yttrium]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.mark_published.outputs.published || 'false' }}
    steps:
      - name: Check if reown_core should be published
        if: github.event.inputs.core == 'false'
        run: |
          echo "Skipping reown_core publishing because input was false."
        continue-on-error: false

      - name: Checkout code
        if: github.event.inputs.core == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch_name }}
          fetch-depth: 0 # Required for git push

      - name: Set up Flutter
        if: github.event.inputs.core == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Install yq
        if: github.event.inputs.core == 'true'
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: Update reown_yttrium dependency in reown_core/pubspec.yaml
        if: github.event.inputs.core == 'true' && github.event.inputs.yttrium == 'true' && needs.publish-yttrium.outputs.package_version != ''
        working-directory: packages/reown_core
        run: |
          YTTRIUM_VERSION=${{ needs.publish-yttrium.outputs.package_version }}
          echo "Updating reown_yttrium dependency to ^$YTTRIUM_VERSION in reown_core/pubspec.yaml"
          yq e ".dependencies.reown_yttrium = \"^$YTTRIUM_VERSION\"" -i pubspec.yaml

      - name: Commit and push pubspec.yaml changes for reown_core
        if: github.event.inputs.core == 'true' && github.event.inputs.yttrium == 'true' && needs.publish-yttrium.outputs.package_version != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cd packages/reown_core
          # Check if there are changes to commit to prevent empty commits
          if [[ -n $(git status -s pubspec.yaml) ]]; then
            git add pubspec.yaml
            git commit -m "ci(reown_core): Update reown_yttrium to ^${{ needs.publish-yttrium.outputs.package_version }} [skip ci]"
            git push origin ${{ needs.create-branch.outputs.branch_name }}
          else
            echo "No changes to commit in reown_core/pubspec.yaml"
          fi

      - name: Get package version from reown_core/pubspec.yaml
        if: github.event.inputs.core == 'true'
        id: get_version
        working-directory: packages/reown_core
        run: echo "version=$(yq e '.version' pubspec.yaml)" >> $GITHUB_OUTPUT

      - name: Run generate_files.sh for reown_core
        if: github.event.inputs.core == 'true'
        working-directory: packages/reown_core
        run: |
          chmod +x generate_files.sh
          sh ./generate_files.sh

      - name: Check Publish Warnings
        if: github.event.inputs.core == 'true'
        shell: bash
        run: |
          set -o pipefail

          OUTPUT=$(flutter pub publish --dry-run 2>&1 || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -iE "^Error:|validation.*error|validation.*failed"; then
            echo "❌ Real error(s) detected in pub publish dry-run"
            exit 1
          else
            echo "✅ No real errors, only warnings (e.g. missing CHANGELOG.md)"
          fi

      - name: Configure pub.dev credentials
        if: github.event.inputs.core == 'true'
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p $HOME/.config/dart
          (umask 077; printf '%s' "$PUB_CREDENTIALS" > $HOME/.config/dart/pub-credentials.json)

      - name: Publish reown_core to pub.dev
        if: github.event.inputs.core == 'true'
        working-directory: packages/reown_core
        run: flutter pub publish --force

      - name: Remove pub.dev credentials
        if: always() && github.event.inputs.core == 'true'
        run: rm -f $HOME/.config/dart/pub-credentials.json

      - name: Wait for reown_core to be available on pub.dev
        if: github.event.inputs.core == 'true'
        run: |
          chmod +x .github/scripts/wait_for_package.sh
          .github/scripts/wait_for_package.sh reown_core ${{ steps.get_version.outputs.version }}

      - name: Mark reown_core as published
        id: mark_published
        if: github.event.inputs.core == 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.0
        if: github.event.inputs.core == 'true'
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*reown_core*: ^${{ steps.get_version.outputs.version }} has been published: https://pub.dev/packages/reown_core"

  publish-sign:
    name: Publish reown_sign
    needs: [create-branch, publish-core]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.mark_published.outputs.published || 'false' }}
    steps:
      - name: Check if reown_sign should be published
        if: github.event.inputs.sign == 'false'
        run: |
          echo "Skipping reown_sign publishing because input was false."
        continue-on-error: false

      - name: Checkout code
        if: github.event.inputs.sign == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-branch.outputs.branch_name }}
          fetch-depth: 0 # Required for git push

      - name: Set up Flutter
        if: github.event.inputs.sign == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"

      - name: Install yq
        if: github.event.inputs.sign == 'true'
        run: sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      - name: Update reown_core dependency in reown_sign/pubspec.yaml
        if: github.event.inputs.sign == 'true' && github.event.inputs.core == 'true' && needs.publish-core.outputs.package_version != ''
        working-directory: packages/reown_sign
        run: |
          CORE_VERSION=${{ needs.publish-core.outputs.package_version }}
          echo "Updating reown_core dependency to ^$CORE_VERSION in reown_sign/pubspec.yaml"
          yq e ".dependencies.reown_core = \"^$CORE_VERSION\"" -i pubspec.yaml

      - name: Commit and push pubspec.yaml changes for reown_sign
        if: github.event.inputs.sign == 'true' && github.event.inputs.core == 'true' && needs.publish-core.outputs.package_version != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          cd packages/reown_sign
          # Check if there are changes to commit to prevent empty commits
          if [[ -n $(git status -s pubspec.yaml) ]]; then
            git add pubspec.yaml
            git commit -m "ci(reown_sign): Update reown_core to ^${{ needs.publish-core.outputs.package_version }} [skip ci]"
            git push origin ${{ needs.create-branch.outputs.branch_name }}
          else
            echo "No changes to commit in reown_sign/pubspec.yaml"
          fi

      - name: Get package version from reown_sign/pubspec.yaml
        if: github.event.inputs.sign == 'true'
        id: get_version
        working-directory: packages/reown_sign
        run: echo "version=$(yq e '.version' pubspec.yaml)" >> $GITHUB_OUTPUT

      - name: Run generate_files.sh for reown_sign
        if: github.event.inputs.sign == 'true'
        working-directory: packages/reown_sign
        run: |
          chmod +x generate_files.sh
          sh ./generate_files.sh

      - name: Check Publish Warnings
        if: github.event.inputs.sign == 'true'
        shell: bash
        run: |
          set -o pipefail

          OUTPUT=$(flutter pub publish --dry-run 2>&1 || true)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -iE "^Error:|validation.*error|validation.*failed"; then
            echo "❌ Real error(s) detected in pub publish dry-run"
            exit 1
          else
            echo "✅ No real errors, only warnings (e.g. missing CHANGELOG.md)"
          fi

      - name: Configure pub.dev credentials
        if: github.event.inputs.sign == 'true'
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p $HOME/.config/dart
          (umask 077; printf '%s' "$PUB_CREDENTIALS" > $HOME/.config/dart/pub-credentials.json)

      - name: Publish reown_sign to pub.dev
        if: github.event.inputs.sign == 'true'
        working-directory: packages/reown_sign
        run: flutter pub publish --force

      - name: Remove pub.dev credentials
        if: always() && github.event.inputs.sign == 'true'
        run: rm -f $HOME/.config/dart/pub-credentials.json

      - name: Wait for reown_sign to be available on pub.dev
        if: github.event.inputs.sign == 'true'
        run: |
          chmod +x .github/scripts/wait_for_package.sh
          .github/scripts/wait_for_package.sh reown_sign ${{ steps.get_version.outputs.version }}

      - name: Mark reown_sign as published
        id: mark_published
        if: github.event.inputs.sign == 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.0
        if: github.event.inputs.sign == 'true'
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*reown_sign*: ^${{ steps.get_version.outputs.version }} has been published: https://pub.dev/packages/reown_sign"

  publish-appkit:
    name: Publish reown_appkit
    needs: [create-branch, publish-core, publish-sign]
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.mark_published.outputs.published || 'false' }}
