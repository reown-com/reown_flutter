  publish-yttrium:
    name: Publish reown_yttrium
    needs: [create-branch] # Not really needed in this package but still used in case is needed in the future
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.get_version.outputs.version }}
