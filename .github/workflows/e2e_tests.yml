# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Integration tests (reown_core, reown_sign, reown_appkit, reown_walletkit)
# against the live relay. The Maestro E2E suites live in
# ci_e2e_connect_tests.yml (WalletKit connect, SLO 2) and ci_e2e_pay_tests.yml.
name: E2E Tests
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-16core

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up environment
      - uses: ./.github/actions/dependencies

      # Run Integration Tests
      - name: Run Integration Tests
        uses: ./.github/actions/tests
        with:
          type: "integration-tests"
          relay-endpoint: "wss://relay.walletconnect.org"
          project-id: ${{ secrets.DAPP_PROJECT_ID }}
