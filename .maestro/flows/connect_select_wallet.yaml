appId: ${APP_ID}
---
# dApp-specific flow: from the dApp, open the AppKit modal and pick "Flutter
# Sample Wallet", a custom wallet in the dApp's AppKit config (mobileLink
# wcflutterwallet-internal://, Android package
# com.walletconnect.flutterwallet.internal). Custom wallets come first in the
# modal's list, so it's on the first screen, and AppKit hands the pairing URI
# straight to the wallet installed by CI. Ends with the session proposal in
# the wallet.

- tapOn:
    id: "connect-button"
# The row is rendered by AppKit, so it can't carry an id; match the name (its
# label is "Flutter Sample Wallet enabled").
- extendedWaitUntil:
    visible: "Flutter Sample Wallet.*"
    timeout: 30000

# Done once the wallet shows the session proposal. Each tap waits for the
# modal to settle (connect_settle.yaml), and is repeated only while the row is
# still on screen: a tap that lands moves AppKit to its "connecting" screen.
- retry:
    maxRetries: 3
    commands:
      - runFlow: connect_settle.yaml
      - runFlow:
          when:
            visible: "Flutter Sample Wallet.*"
          commands:
            - tapOn: "Flutter Sample Wallet.*"
      - runFlow: connect_ios_open_prompt.yaml
      - extendedWaitUntil:
          visible:
            id: "wallet-request-approve"
          timeout: 20000
